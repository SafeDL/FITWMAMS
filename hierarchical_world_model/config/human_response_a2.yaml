# The sole new candidate: human-response-calibrated A2 over the frozen world.
schema_name: human_response_a2
schema_version: 1
base_config: hierarchical_world_model/config/world_model.yaml
paths:
  output_dir: results/hierarchical_world_model/human_response_a2
  baseline_checkpoint: results/hierarchical_world_model/ppo_idm_response/checkpoint.pt
  rule_model: results/hierarchical_world_model/ppo_idm_response/rules/idm_mobil.json
  event_reference: results/hierarchical_world_model/reaction_events
method:
  controller: human_response_a2
  physical_only_guard: true
  correction_jerk_limit_mps3: 12.0
  max_mechanism_scale: 1.5
  max_signed_residual_mps2: 4.0
human_reference:
  neighbors: 16
  minimum_recordings: 5
  supported_quantile: 0.95
  weak_quantile: 0.99
training:
  device: auto
  seed: 20260910
  rollout_steps: 149
  event_groups_per_update: 8
  futures_per_event: 8
  synthetic_pairs_per_update: 8
  pretrain_updates: 400
  pretrain_minibatch_size: 2048
  max_ppo_updates: 500
  minimum_ppo_updates: 120
  ppo_epochs_per_update: 8
  minibatch_size: 2048
  learning_rate_start: 0.0003
  learning_rate_end: 0.00003
  entropy_start: 0.005
  entropy_end: 0.001
  clip_ratio: 0.2
  target_kl: 0.015
  inner_epoch_stop_kl: 0.030
  gamma: 0.99
  gae_lambda: 0.95
  value_coefficient: 0.5
  max_grad_norm: 1.0
  mechanism_weight: 0.2
  mechanism_direction_weight: 1.0
  mechanism_magnitude_weight: 0.1
  anchor_weight: 0.1
  quick_validation_interval: 20
  quick_validation_events: 32
  quick_validation_futures: 8
  quick_improvement_fraction: 0.005
  early_stopping_patience: 5
evaluation:
  validation_futures: 32
  factual_absolute_tolerance_m:
    ade: 0.02
    fde: 0.06
    p95: 0.10
  factual_relative_tolerance: 0.05
