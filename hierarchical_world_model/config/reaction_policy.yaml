# Calibrated residual policy.  Flow, Diffusion and HiQR remain frozen.
base_config: hierarchical_world_model/config/release.yaml
paths:
  output_dir: results/hierarchical_world_model/causal_reaction/calibrated_residual
  rule_model: results/hierarchical_world_model/causal_reaction/formal/idm_mobil/highd_global_idm_mobil.json
  event_reference: results/hierarchical_world_model/causal_reaction/reaction_events
training:
  device: auto
  seed: 20260906
  diffusion_ddim_steps: 20
  rollout_steps: 149
  episodes_per_rollout: 64
  event_episodes: 32
  non_event_episodes: 16
  synthetic_episodes: 16
  pretrain_epochs: 3
  objective_check_events: 4
  objective_check_futures: 8
  epochs_per_update: 4
  minibatch_size: 2048
  updates: 700
  learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.2
  value_coefficient: 0.5
  entropy_coefficient: 0.01
  max_grad_norm: 1.0
  invalid_penalty: 10.0
  jerk_limit_mps3: 12.0
  safety_ttc_s: 2.0
  physical_safety_weight: 2.0
  physical_jerk_weight: 0.10
  reaction_min_frames: 5
  reaction_max_frames: 149
  reaction_recovery_frames: 15
  reaction_release_ttc_s: 4.0
  influence_radius_m: 50.0
  influence_secondary_radius_m: 35.0
  influence_prediction_horizon_s: 1.5
  influence_stable_release_frames: 13
  validation_interval_updates: 10
  validation_events: 32
  validation_futures: 32
  validation_patience: 4
  validation_minimum_improvement: 0.002
  # Preserve the longitudinal schedule offset; lateral structure may return
  # to the conditional macro reference.
  longitudinal_reference_offset_weight: 1.0
  lateral_reference_offset_weight: 0.0
evidence:
  brake_threshold_mps2: 0.5
  minimum_brake_frames: 3
  merge_gap_frames: 25
  minimum_events_per_cell: 100
  minimum_recordings_per_cell: 5
  evaluation_window_frames: 25
