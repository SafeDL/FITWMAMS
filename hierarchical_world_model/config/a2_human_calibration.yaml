# Paused candidate: frozen A2 proposal plus a stochastic calibration adapter.
schema_name: a2_human_calibration
schema_version: 1
base_config: hierarchical_world_model/config/world_model.yaml
paths:
  output_dir: results/hierarchical_world_model/a2_human_calibration
  baseline_checkpoint: results/hierarchical_world_model/ppo_idm_response/checkpoint.pt
  rule_model: results/hierarchical_world_model/ppo_idm_response/rules/idm_mobil.json
  event_reference: results/hierarchical_world_model/reaction_events
method:
  controller: a2_human_calibration
  frozen_response_prior: ppo_idm_response
  # Do not train against a factual protocol that has not been aligned with
  # the historical bridge evaluation; see the protocol-correction document.
  protocol_status: blocked_pending_aligned_factual_protocol
  use_legacy_ttc_guard: false
  correction_jerk_limit_mps3: 12.0
adapter:
  hidden_dim: 64
  scale_radius: 0.75
  residual_max_mps2: 2.0
  initial_log_std: -2.0
human_response:
  channels: [acceleration, abs_jerk]
  prefixes: [5, 10, 25]
  prefix_weights: [0.25, 0.35, 0.40]
  support_weight:
    empirically_supported: 1.0
    weakly_supported: 0.5
    unsupported_by_training_evidence: 0.0
supervised:
  updates: 400
  minibatch_size: 2048
  event_frames: 25
  event_weight: 1.0
  non_event_weight: 1.0
  non_event_calibration_weight: 0.1
  prior_regularization: 0.01
  maximum_a2_es_ratio: 1.10
ppo:
  seed: 20260911
  rollout_steps: 149
  event_groups_per_update: 8
  futures_per_event: 8
  minimum_updates: 40
  maximum_updates: 160
  epochs_per_update: 4
  minibatch_size: 2048
  learning_rate_start: 3.0e-5
  learning_rate_end: 1.0e-5
  clip_ratio: 0.2
  target_kl: 0.010
  inner_stop_kl: 0.020
  entropy_coefficient: 0.001
  reference_kl_target: 0.010
  reference_kl_coefficient: 0.1
  reference_kl_minimum: 1.0e-4
  reference_kl_maximum: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  value_coefficient: 0.5
  max_grad_norm: 1.0
  quick_validation_interval: 10
  quick_validation_events: 32
  quick_validation_futures: 8
  quick_policy_on_stress_rows: 512
  quick_improvement_fraction: 0.005
  early_stopping_patience: 4
auxiliary:
  anchor_weight: 0.1
  mechanism_weight: 0.2
  synthetic_pairs_per_update: 8
  direction_weight: 1.0
  magnitude_weight: 0.1
evaluation:
  policy_on_stress_chunk_rows: 64
  validation_futures: 32
  non_event_futures: 8
  ood_rows: 256
  bootstrap_draws: 2000
  bootstrap_seed: 17
  factual_absolute_tolerance_m: {ade: 0.02, fde: 0.06, p95: 0.10}
  factual_relative_tolerance: 0.05
