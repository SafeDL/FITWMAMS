paths:
  output_dir: /home/hp/FITWMAMS/results/background_diffusion
  sequence_cache_dir: /home/hp/FITWMAMS/results/highd_shared_training_data/highd_sequence_cache
  source_schema: /home/hp/FITWMAMS/results/highd_natural_driving_flow/dataset_schema.json
  cutin_cohort_dir: /home/hp/FITWMAMS/results/highd_shared_training_data/cohorts/cutin_crossing_4s

dataset:
  sequence_protocol: fixed_horizon_5p96
  target_representation: smooth_reference_relative_dx_dy_residual
  condition_mode: c0_long_horizon_state_knots
  include_ego_future: false
  max_train_sequences: 0
  max_val_sequences: 0

model:
  denoiser: factorized_spatiotemporal
  hidden_dim: 96
  num_layers: 3
  num_heads: 4
  dropout: 0.1

diffusion:
  steps: 100
  prediction_type: v_prediction
  condition_dropout_prob: 0.0
  min_snr_gamma: 5.0
  x0_clip_abs: 2.5

loss:
  x0_weight: 0.1
  smooth_weight: 0.05
  long_horizon_weight: 0.05
  trajectory_position_weight: 0.5
  trajectory_velocity_weight: 0.2

training:
  seed: 20260812
  device: auto
  epochs: 50
  batch_size: 64
  val_batch_size: 64
  num_workers: 4
  learning_rate: 3.0e-4
  minimum_learning_rate: 3.0e-5
  weight_decay: 1.0e-4
  grad_clip: 1.0
  ema_decay: 0.999
  fixed_validation_seed: 12345
  early_stopping_patience: 6
  early_stopping_minimum_delta: 1.0e-5
  tensorboard: false

evaluation:
  seed: 20260812
  device: auto
  split: test
  max_sequences: 0
  batch_size: 16
  num_workers: 4
  samples_per_condition: 4
  ddim_steps: 50
  x0_clip_abs: 2.5
  guidance_scale: 1.0
