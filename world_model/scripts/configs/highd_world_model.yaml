# highD 长尾背景交通世界模型：唯一活动实现 CAT-K。

paths:
  highd_evt_config: "../../../process_highD/scripts/configs/highd_natural_evt.yaml"
  raw_dir: "../../../highD_dataset/Matlab/data"
  natural_segments_csv: "../../../results/highd_natural_evt/natural_segments.csv"
  tail_context_csv: "../../../results/highd_natural_evt/natural_tail_contexts.csv"
  dataset_dir: "../../../results/highd_world_model/shared_dense_start_roll"
  output_dir: "../../../results/highd_world_model/catk_topk"

sampling:
  target_fps: 25

dataset:
  history_seconds: 1.0
  horizon_seconds: 1.0
  segment_window_seconds: 6.0
  roll_start_seconds: 1.0
  roll_end_seconds: 4.8
  roll_stride_seconds: 0.20
  max_segments: 0

split:
  group_by: "recording_ego"
  ratios: [0.70, 0.15, 0.15]
  seed: 42

model:
  type: "catk_topk"
  hidden_dim: 128
  history_layers: 2
  interaction_layers: 2
  num_heads: 4
  dropout: 0.10
  use_start_flow_summary: true
  use_relation_features: true
  num_candidates: 8
  responsibility_temperature: 1.0
  energy_weight: 0.01
  diversity_weight: 0.15
  diversity_margin_normalized: 0.15
  smoothness_weight: 0.01
  map_action_weight: 0.10
  probability_entropy_weight: 0.05
  min_probability_entropy: 1.50
  jerk_control_points: 5
  max_jerk_longitudinal_mps3: 8.0
  max_jerk_lateral_mps3: 5.0
  nominal_logit_margin: 0.05

training:
  seed: 42
  device: "auto"
  epochs: 160
  batch_size: 1024
  num_workers: 0
  learning_rate: 0.00005
  min_learning_rate: 0.000002
  weight_decay: 0.0001
  grad_clip: 1.0
  resume_from_checkpoint: false
  performance:
    allow_tf32: true
    float32_matmul_precision: "high"
    mixed_precision: "bf16"
    fused_adamw: true
    compile_model: false
    compile_mode: "default"
  no_improvement_patience: 0
  no_improvement_min_delta: 0.0001
  diagnostic_validation_interval: 5
  model_state_closed_loop:
    max_chunks: 5
    curriculum_epochs_per_chunk: 8
    state_consistency_weight: 0.10

evaluation:
  seed: 123
  device: "auto"
  batch_size: 1024
  performance:
    allow_tf32: false
    float32_matmul_precision: "highest"
  sampling_temperature: 1.0
  splits: ["val", "test"]
  closed_loop:
    enabled: true
    max_samples: 0
  model_state_reconstruction:
    enabled: true
    max_chunks: 5
    max_samples: 0
  tail_event_reconstruction:
    enabled: true
    max_samples: 0
    write_event_metrics: false
  visualizations:
    enabled: false
