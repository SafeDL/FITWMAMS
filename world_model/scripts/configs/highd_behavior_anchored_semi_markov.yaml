# The sole behavior-anchored experiment.  Use m0 for its cold-start ablation
# or m1 for the retained candidate; the shared cache remains read-only.
paths:
  legacy_dataset_dir: "../../../results/highd_world_model/shared_dense_start_roll"
  # V2 is a clean retraining after START feedback and segment-duration
  # alignment.  The previous flow-aligned directory remains read-only
  # historical evidence and is never mixed with this run.
  output_dir: "../../../results/highd_world_model/behavior_anchored_semi_markov_m1_start_roll_v2"
  sequence_cache_dir: "../../../results/highd_world_model/semi_markov_relational_full"
  highd_evt_config: "../../../process_highD/scripts/configs/highd_natural_evt.yaml"
  flow_checkpoint: "../../../results/highd_tail_flow_best/checkpoints/best_tail_conditional_maf.pt"
  flow_schema: "../../../results/highd_tail_flow_best/dataset_schema.json"
  flow_checkpoint_sha256: "206dbb371c80a46232f5f9dd92a98810b1c8644d1002989fc895d82ca4f45a68"
  flow_schema_sha256: "b4091005a5fb562946af419513df027c049096423dfd63e4674a1e704b99ff8a"

dataset:
  max_sequences: 0

split:
  seed: 42

graph:
  lane_width_m: 3.6
  top_r_lanes: 3
  use_recording_lane_metadata: true

model:
  type: "semi_markov_relational"
  variant: "m1"
  anchor_loss_weight: 1.0
  # Stage A must optimize the deployed first-second path directly; the
  # horizon-average ROLL loss alone underweights its endpoint.
  start_roll_weight: 4.0
  cold_start_history: true
  hidden_dim: 128
  temporal_layers: 1
  dropout: 0.10
  num_latent_states: 12
  max_duration_response_steps: 30
  response_interval_s: 0.2
  simulation_dt_s: 0.04
  beta_latent: 0.05
  lambda_roll: 1.0
  position_weight: 1.0
  velocity_weight: 0.25
  control_weight: 0.15
  boundary_change_threshold: 0.05
  boundary_supervision_weight: 0.25
  prototype_weight: 1.0
  state_bootstrap_weight: 5.0
  prior_roll_weight: 1.0
  late_roll_weight: 0.0
  prior_control_weight: 3.0
  late_prior_control_weight: 0.0
  reference_control_scale: 1.0

training:
  seed: 42
  device: "auto"
  epochs: 20
  stage_one_epochs: 0
  min_teacher_forcing: 0.0
  rollout_min_seconds: 1.0
  rollout_max_seconds: 5.0
  tbptt_response_steps: 5
  # The full cache is memory mapped and this model occupies little GPU memory;
  # 512 keeps the training full-data while avoiding needless Python-batch
  # overhead on the available 24 GB GPU.
  batch_size: 512
  num_data_workers: 4
  learning_rate: 0.00005
  weight_decay: 0.0001
  grad_clip: 1.0
  m0_reference_checkpoint: "../../../results/highd_world_model/semi_markov_relational_full_tbptt_finetune/checkpoints/best_semi_markov_relational.pt"
  stages:
    - {name: "anchor_realization", epochs: 5}
    - {name: "roll", epochs: 10}
    - {name: "joint", epochs: 5}
  encoder_learning_rate: 0.000005
  decoder_prior_learning_rate: 0.00001
  anchor_learning_rate: 0.00005

evaluation:
  seed: 123
  device: "auto"
  batch_size: 64
  max_sequences: 0
  cold_start_history: true
  # The retained frozen M0 report is the explicit first-second gate.  CAT-K
  # remains a separate paired comparison, not a substitute for this ablation.
  required_baseline_summary: "../../../results/highd_world_model/behavior_anchored_semi_markov_m0_flow_aligned_reference/semi_markov_evaluation_summary.json"
  round_evaluation_summary: ""
  # Preserve only the released CAT-K interface, which uses its future-action
  # START summary.  Its information advantage is reported explicitly.
  legacy_paired_baseline_summary: "../../../results/highd_world_model/behavior_anchored_semi_markov_m1_start_roll_v2/paired_semi_markov_vs_catk_legacy_standard.json"
  legacy_paired_long_horizon_baseline_summary: "../../../results/highd_world_model/behavior_anchored_semi_markov_m1_start_roll_v2/paired_semi_markov_vs_catk_5s_legacy_standard.json"
