# Semi-Markov World Model: supervise a one-second temporal plan in physical
# state space, then execute a bounded receding-horizon continuation.
paths:
  legacy_dataset_dir: "../../../results/highd_world_model/training_data/cat_topk_start_roll_cache"
  output_dir: "../../../results/highd_world_model/semi_markov_world_model"
  sequence_cache_dir: "../../../results/highd_world_model/training_data/semi_markov_sequence_cache"
  highd_evt_config: "../../../process_highD/scripts/configs/highd_natural_evt.yaml"
  flow_checkpoint: "../../../results/highd_tail_flow/checkpoints/best_tail_conditional_maf.pt"
  flow_schema: "../../../results/highd_tail_flow/dataset_schema.json"
  flow_checkpoint_sha256: "206dbb371c80a46232f5f9dd92a98810b1c8644d1002989fc895d82ca4f45a68"
  flow_schema_sha256: "b4091005a5fb562946af419513df027c049096423dfd63e4674a1e704b99ff8a"

dataset:
  max_sequences: 0

split:
  seed: 42

graph:
  lane_width_m: 3.6
  top_r_lanes: 3
  use_recording_lane_metadata: true

model:
  type: "semi_markov_relational"
  anchor_loss_weight: 1.0
  start_roll_weight: 4.0
  cold_start_history: true
  use_start_flow_summary: true
  hidden_dim: 128
  temporal_layers: 1
  dropout: 0.10
  num_latent_states: 12
  max_duration_response_steps: 30
  response_interval_s: 0.2
  simulation_dt_s: 0.04
  beta_latent: 0.05
  lambda_roll: 1.0
  position_weight: 1.0
  velocity_weight: 0.25
  control_weight: 0.15
  boundary_change_threshold: 0.05
  boundary_supervision_weight: 0.25
  prototype_weight: 1.0
  state_bootstrap_weight: 5.0
  prior_roll_weight: 1.0
  late_roll_weight: 0.0
  prior_control_weight: 3.0
  late_prior_control_weight: 0.0
  reference_control_scale: 1.0
  plan_horizon_frames: 25
  plan_execute_frames: 5
  plan_loss_weight: 0.20
  plan_state_loss_weight: 0.50
  overlap_loss_weight: 0.10
  overlap_relation_scale: 1.0
  local_residual_weight: 0.01
  plan_smoothness_weight: 0.01
  plan_carry_mix: 0.20
  plan_carry_start_response_steps: 14

training:
  seed: 42
  device: "auto"
  epochs: 30
  # Train the complete Semi-Markov World Model from random initialization.
  # The Flow summary is a fixed input feature, not a loaded world-model state.
  train_all_parameters: true
  min_teacher_forcing: 0.0
  rollout_min_seconds: 3.0
  rollout_max_seconds: 5.0
  tbptt_response_steps: 5
  batch_size: 128
  num_workers: 4
  learning_rate: 0.00005
  weight_decay: 0.0001
  grad_clip: 1.0
  stages:
    - {name: "joint", epochs: 30}
  encoder_learning_rate: 0.00005
  decoder_prior_learning_rate: 0.00005

evaluation:
  seed: 123
  device: "auto"
  batch_size: 64
  max_sequences: 0
  cold_start_history: true
