# CAT-K v3：共享物理动作骨干与场景级离散意图残差。
# 所有随机性仍只来自每个 chunk 的 Xi_world 八分类索引。

seed: 42

paths:
  highd_evt_config: "../../../process_highD/scripts/configs/highd_natural_evt.yaml"
  raw_dir: "../../../highD_dataset/Matlab/data"
  natural_segments_csv: "../../../results/highd_natural_evt/natural_segments.csv"
  tail_context_csv: "../../../results/highd_natural_evt/natural_tail_contexts.csv"
  dataset_dir: "../../../results/highd_world_model/shared_dense_start_roll"
  output_dir: "../../../results/highd_world_model/catk_topk_physics_backbone_zero_init"

model:
  type: "catk_topk"
  architecture_version: 3
  hidden_dim: 128
  history_layers: 2
  interaction_layers: 2
  num_heads: 4
  dropout: 0.10
  use_start_flow_summary: true
  use_relation_features: true
  num_candidates: 8
  responsibility_temperature: 1.0
  energy_weight: 0.01
  diversity_weight: 0.05
  diversity_margin_normalized: 0.10
  smoothness_weight: 0.01
  map_action_weight: 0.0
  probability_entropy_weight: 0.02
  min_probability_entropy: 1.0
  physics_action_weight: 0.50
  jerk_control_points: 5
  max_jerk_longitudinal_mps3: 8.0
  max_jerk_lateral_mps3: 5.0
  branch_noise_std: 0.0

environment:
  candidate_selection: "categorical"
  candidate_temperature: 1.0
  world_seed: 123

training:
  seed: 42
  device: "auto"
  epochs: 160
  batch_size: 384
  num_workers: 0
  learning_rate: 0.00005
  min_learning_rate: 0.000002
  weight_decay: 0.0001
  grad_clip: 1.0
  resume_from_checkpoint: true
  initialize_from_checkpoint: ""
  performance:
    allow_tf32: true
    float32_matmul_precision: "high"
    mixed_precision: "bf16"
    fused_adamw: true
    compile_model: false
    compile_mode: "default"
  no_improvement_patience: 0
  no_improvement_min_delta: 0.0001
  diagnostic_validation_interval: 5
  closed_loop_adaptation:
    enabled: false
    probability: 0.0
    history_dropout_probability: 0.0
    state_noise_std:
      x_m: 0.0
      y_left_m: 0.0
      vx_mps: 0.0
      vy_left_mps: 0.0
      ax_mps2: 0.0
      ay_left_mps2: 0.0
  loss_weights:
    trajectory: 0.0
    interaction: 0.0
    physics: 0.0
  model_state_closed_loop:
    enabled: true
    max_chunks: 5
    curriculum_epochs_per_chunk: 8
    state_consistency_weight: 0.20
    teacher_action_weight: 0.0

evaluation:
  seed: 123
  device: "auto"
  batch_size: 1024
  performance:
    allow_tf32: false
    float32_matmul_precision: "highest"
  sampling_temperature: 1.0
  sampling_action_std_floor_mps2: null
  splits: ["val", "test"]
  closed_loop:
    enabled: true
    max_samples: 0
  model_state_reconstruction:
    enabled: true
    max_chunks: 5
    max_samples: 0
  tail_event_reconstruction:
    enabled: true
    max_samples: 0
    write_event_metrics: false
  visualizations:
    enabled: false
