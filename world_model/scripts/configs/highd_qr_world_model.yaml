# Formal full-data QR-WM configuration.  This is independent of RAMP/FIRM.
paths:
  output_dir: "../../../results/highd_world_model/qr_world_model"
  # QR owns this cache and retains all 150 observed highD states.
  sequence_cache_dir: "../../../results/highd_world_model/training_data/qr_sequence_cache"
  source_dataset_dir: "../../../results/highd_world_model/training_data/cat_topk_start_roll_cache"
  highd_evt_config: "../../../process_highD/scripts/configs/highd_natural_evt.yaml"
  flow_schema: "../../../results/highd_tail_flow/dataset_schema.json"

dataset:
  sequence_protocol: "start_roll_5p96"
  # START means natural segment-start behavior reconstruction; it is not
  # asserted to coincide with an EVT risk-event onset.
  # Formal training is intentionally over every immutable highD train sequence.
  max_sequences: 0

model:
  hidden_dim: 128
  behavior_latent_dim: 16
  temporal_layers: 1
  attention_layers: 2
  num_heads: 4
  dropout: 0.10
  plan_frames: 25
  execute_frames: 5
  rollout_frames: 149
  start_reconstruction_frames: 25
  response_interval_s: 0.20
  simulation_dt_s: 0.04
  lane_width_m: 3.6
  min_acceleration: -8.0
  max_acceleration: 4.0
  max_yaw_rate: 0.60
  refinement_iterations: 2
  buffer_carry_mix: 0.35
  # Convex B0-to-fresh-plan mixing starts at this value and decays to zero
  # across the first one-second background future-action sequence.
  start_anchor_mix: 0.75
  start_summary_weight: 0.10
  position_weight: 1.0
  velocity_weight: 0.25
  action_weight: 0.20
  plan_position_weight: 0.25
  plan_action_weight: 0.10
  refinement_weight: 0.35
  overlap_weight: 0.10
  interaction_weight: 0.12
  physical_weight: 0.03
  behavior_kl_weight: 0.02
  behavior_reconstruction_weight: 0.08
  diversity_weight: 0.01

training:
  seed: 20260730
  device: auto
  # Common formal training budget: 8 + 12 + 20 = 40 epochs.
  epochs: 40
  batch_size: 96
  val_batch_size: 96
  num_workers: 4
  learning_rate: 0.00008
  weight_decay: 0.0001
  grad_clip: 1.0
  tbptt_response_steps: 5
  tensorboard: true
  tensorboard_dir: tensorboard
  stages:
    - {name: buffer_warmup, epochs: 8, rollout_seconds: 1.0, learning_rate: 0.00010}
    - {name: closed_loop, epochs: 12, rollout_seconds: 3.0, learning_rate: 0.00005}
    # Complete protocol: 1.00 s Flow-conditioned START reconstruction plus
    # 4.96 s B0-free ROLL.  The last 5 Hz response has four physical ticks,
    # matching the 150 recorded highD state points without fabricating S150.
    - {name: full_refinement, epochs: 20, rollout_seconds: 5.96, learning_rate: 0.00003, batch_size: 64, val_batch_size: 64}

evaluation:
  seed: 20260730
  device: auto
  batch_size: 96
  num_workers: 4
  max_sequences: 0
  multimodal_samples: 4
