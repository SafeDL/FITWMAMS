# RAMP-WM: final independent continuous-memory joint-plan training from random initialization.
paths:
  output_dir: "../../../results/highd_world_model/ramp_world_model"
  sequence_cache_dir: "../../../results/highd_world_model/training_data/semi_markov_sequence_cache"
  flow_schema: "../../../results/highd_tail_flow/dataset_schema.json"

dataset:
  max_sequences: 0
split:
  seed: 42
model:
  hidden_dim: 128
  temporal_layers: 1
  dropout: 0.10
  num_candidates: 8
  plan_frames: 25
  execute_frames: 5
  jerk_controls: 5
  response_interval_s: 0.2
  simulation_dt_s: 0.04
  max_longitudinal_jerk: 5.0
  max_yaw_jerk: 0.50
  hard_jerk_projection: true
  mixture_temperature: 0.25
  position_weight: 1.0
  velocity_weight: 0.25
  control_weight: 0.20
  mixture_weight: 0.50
  probability_weight: 0.10
  overlap_weight: 0.15
  diversity_weight: 0.02
  smoothness_weight: 0.01
training:
  seed: 42
  device: auto
  # Common formal training budget: 8 + 12 + 20 = 40 epochs.
  epochs: 40
  batch_size: 64
  val_batch_size: 64
  # The full sequence cache is memory-mapped.  A single loader process avoids
  # duplicating multi-GB worker address spaces and gives deterministic epoch
  # diagnostics on the shared training GPU.
  num_workers: 0
  learning_rate: 0.00005
  weight_decay: 0.0001
  grad_clip: 1.0
  tbptt_response_steps: 5
  # Stage A uses one nominal candidate in the loss path via candidate 0;
  # stages B/C activate joint candidate probability and long autoregression.
  stages:
    - {name: nominal, epochs: 8, rollout_seconds: 1.0, learning_rate: 0.00010}
    # Four epochs at each horizon implement the required 1 -> 2 -> 3 s
    # closed-loop curriculum before the five-second fine-tuning stage.
    - {name: joint, epochs: 12, rollout_curriculum_seconds: [1.0, 2.0, 3.0], learning_rate: 0.00005}
    - {name: five_second, epochs: 20, rollout_seconds: 5.0, learning_rate: 0.00002}
evaluation:
  seed: 123
  device: auto
  batch_size: 64
  max_sequences: 0
