# Isolated capacity check: 64 fixed stable-slot sequences, not a benchmark run.
paths:
  output_dir: /home/hp/FITWMAMS/results/highd_world_model/hiqr_v2_world_model/readiness/overfit
  v1_sidecar_output_dir: /home/hp/FITWMAMS/results/highd_world_model/hiqr_world_model
  sequence_cache_dir: /home/hp/FITWMAMS/results/highd_world_model/training_data/qr_sequence_cache
  source_dataset_dir: /home/hp/FITWMAMS/results/highd_world_model/training_data/cat_topk_start_roll_cache
  flow_schema: /home/hp/FITWMAMS/results/highd_tail_flow/dataset_schema.json
dataset:
  sequence_protocol: start_roll_5p96
  max_sequences: 64
model:
  hidden_dim: 128
  scene_latent_dim: 16
  agent_residual_dim: 16
  temporal_layers: 1
  attention_layers: 2
  decoder_layers: 2
  num_heads: 4
  dropout: 0.0
  scene_mode_responses: 5
  residual_noise_scale: 0.0
  physical_mode: "off"
training:
  seed: 20260805
  device: auto
  epochs: 130
  batch_size: 32
  val_batch_size: 32
  gradient_accumulation_steps: 1
  num_workers: 0
  learning_rate: 3.0e-4
  weight_decay: 0.0
  grad_clip: 1.0
  tbptt_response_steps: 10
  scheduler_factor: 0.5
  scheduler_patience: 20
  scheduler_min_lr: 1.0e-06
  tensorboard: true
  tensorboard_dir: tensorboard
  posterior_aux_warmup_epochs: 1
  kl_warmup_epochs: 1
  diversity_start_epoch: 999
  stages:
  - name: overfit_start_1s
    epochs: 30
    rollout_seconds: 1.0
    learning_rate: 3.0e-4
    deterministic_prior_mean: true
    posterior_auxiliary: false
    diversity: false
  - name: overfit_closed_loop_3s
    epochs: 100
    rollout_seconds: 3.0
    learning_rate: 1.0e-4
    deterministic_prior_mean: true
    posterior_auxiliary: false
    diversity: false
evaluation:
  seed: 20260805
  device: auto
  batch_size: 32
  num_workers: 0
  max_sequences: 64
  stochastic_samples: 8
  bootstrap_samples: 1000
