# Semi-Markov Relational Traffic World Model (highD migration prototype).
# The legacy dense cache is read once only to materialize six-second sequences.
paths:
  legacy_dataset_dir: "../../../results/highd_world_model/shared_dense_start_roll"
  output_dir: "../../../results/highd_world_model/semi_markov_relational"
  highd_evt_config: "../../../process_highD/scripts/configs/highd_natural_evt.yaml"

dataset:
  # 0 materializes every available six-second natural-driving sequence.
  max_sequences: 0

split:
  seed: 42

graph:
  lane_width_m: 3.6
  top_r_lanes: 3
  use_recording_lane_metadata: true

model:
  type: "semi_markov_relational"
  hidden_dim: 128
  temporal_layers: 1
  dropout: 0.10
  num_latent_states: 12
  max_duration_response_steps: 30
  response_interval_s: 0.2
  simulation_dt_s: 0.04
  beta_latent: 0.05
  lambda_roll: 1.0
  position_weight: 1.0
  velocity_weight: 0.25
  control_weight: 0.15
  boundary_change_threshold: 0.05
  boundary_supervision_weight: 0.25
  prototype_weight: 1.0
  state_bootstrap_weight: 5.0
  prior_roll_weight: 1.0
  # Part of L_roll: places more mass on later closed-loop response endpoints.
  late_roll_weight: 0.0
  # Directly reconstruct causal-prior controls to stop small acceleration
  # errors accumulating over a five-second rollout.
  prior_control_weight: 3.0
  # Emphasize later causal controls where small acceleration bias compounds.
  late_prior_control_weight: 0.0

training:
  seed: 42
  device: "auto"
  epochs: 80
  stage_one_epochs: 10
  min_teacher_forcing: 0.0
  batch_size: 16
  learning_rate: 0.0002
  weight_decay: 0.0001
  grad_clip: 1.0
  # Checkpoints are selected by a fixed-seed causal-prior rollout FDE on val,
  # rather than a posterior-mixed training objective.
  checkpoint_metric: "causal_prior_rollout_FDE_m"

evaluation:
  seed: 123
  device: "auto"
  batch_size: 16
  max_sequences: 0
  # Promotion is evaluated only when this is a complete, non-bounded cache.
  required_baseline_summary: "../../../results/highd_world_model/catk_topk/evaluation_summary.json"
