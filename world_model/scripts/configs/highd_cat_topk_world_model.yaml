# CAT-TopK reference configuration. The frozen best checkpoint is retained for
# evaluation; training scripts always materialize a separate output directory.
paths:
  dataset_dir: "../../../results/highd_world_model/training_data/cat_topk_start_roll_cache"
  output_dir: "../../../results/highd_world_model/cat_topk_world_model"
  highd_evt_config: "../../../process_highD/scripts/configs/highd_natural_evt.yaml"

dataset:
  max_sequences: 0

split:
  seed: 42

graph:
  lane_width_m: 3.6
  top_r_lanes: 3
  use_recording_lane_metadata: true

model:
  type: "catk_topk"
  hidden_dim: 128
  history_layers: 2
  interaction_layers: 2
  num_heads: 4
  dropout: 0.1
  use_start_flow_summary: true
  use_relation_features: true
  num_candidates: 8
  responsibility_temperature: 1.0
  energy_weight: 0.01
  diversity_weight: 0.15
  diversity_margin_normalized: 0.15
  smoothness_weight: 0.01
  map_action_weight: 0.1
  probability_entropy_weight: 0.05
  min_probability_entropy: 1.5
  jerk_control_points: 5
  max_jerk_longitudinal_mps3: 8.0
  max_jerk_lateral_mps3: 5.0
  nominal_logit_margin: 0.05

training:
  seed: 42
  device: "auto"
  # Common formal training budget for every active world-model method.
  epochs: 40
  batch_size: 128
  num_workers: 4
  learning_rate: 0.0002
  weight_decay: 0.0001
  grad_clip: 1.0
  model_state_closed_loop:
    max_chunks: 5
    curriculum_epochs_per_chunk: 8

evaluation:
  seed: 123
  device: "auto"
  batch_size: 64
  max_sequences: 0
  splits: ["test"]
