# Long-horizon continuation of the selected full-highD Semi-Markov model.
# It preserves the required random 1--5 second rollout/TBPTT protocol while
# assigning explicit weight to later response endpoints in L_roll.
paths:
  legacy_dataset_dir: "../../../results/highd_world_model/shared_dense_start_roll"
  output_dir: "../../../results/highd_world_model/semi_markov_relational_full_long_horizon_finetune"
  sequence_cache_dir: "../../../results/highd_world_model/semi_markov_relational_full"
  highd_evt_config: "../../../process_highD/scripts/configs/highd_natural_evt.yaml"

dataset:
  max_sequences: 0

split:
  seed: 42

graph:
  lane_width_m: 3.6
  top_r_lanes: 3
  use_recording_lane_metadata: true

model:
  type: "semi_markov_relational"
  hidden_dim: 128
  temporal_layers: 1
  dropout: 0.10
  num_latent_states: 12
  max_duration_response_steps: 30
  response_interval_s: 0.2
  simulation_dt_s: 0.04
  beta_latent: 0.05
  lambda_roll: 1.0
  position_weight: 1.0
  velocity_weight: 0.25
  control_weight: 0.15
  boundary_change_threshold: 0.05
  boundary_supervision_weight: 0.25
  prototype_weight: 1.0
  state_bootstrap_weight: 5.0
  prior_roll_weight: 1.0
  # These activate the response-endpoint terms already defined in L_roll.
  late_roll_weight: 1.0
  prior_control_weight: 3.0
  late_prior_control_weight: 1.0
  reference_control_scale: 1.0

training:
  seed: 42
  device: "auto"
  epochs: 4
  stage_one_epochs: 0
  min_teacher_forcing: 0.0
  rollout_min_seconds: 1.0
  rollout_max_seconds: 5.0
  tbptt_response_steps: 5
  batch_size: 128
  learning_rate: 0.000025
  weight_decay: 0.0001
  grad_clip: 1.0
  checkpoint_metric: "causal_prior_rollout_FDE_m"

evaluation:
  seed: 123
  device: "auto"
  batch_size: 64
  max_sequences: 0
  required_baseline_summary: "../../../results/highd_world_model/catk_topk/evaluation_summary.json"
  paired_baseline_summary: ""
  round_evaluation_summary: ""
