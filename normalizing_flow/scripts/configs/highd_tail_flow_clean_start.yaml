# Clean START density model for the Semi-Markov Relational Traffic World Model.
# The output schema deliberately excludes all post-anchor trajectory/action data.
seed: 42
device: auto

paths:
  highd_evt_config: "../../../process_highD/scripts/configs/highd_natural_evt.yaml"
  raw_dir: "../../../highD_dataset/Matlab/data"
  tail_context_csv: "../../../results/highd_natural_evt/natural_tail_contexts.csv"
  output_dir: "../../../results/highd_tail_flow_clean_start"

dataset:
  feature_mode: clean_start
  rebuild: false

split:
  group_by: recording_ego
  ratios: [0.70, 0.15, 0.15]
  seed: 42

model:
  type: conditional_maf
  transform_type: rq_spline
  num_bins: 8
  tail_bound: 4.0
  num_layers: 4
  hidden_features: 128
  num_blocks: 2
  dropout_probability: 0.02
  use_residual_blocks: true
  use_batch_norm: false

training:
  batch_size: 256
  max_epochs: 80
  patience: 16
  learning_rate: 0.0005
  weight_decay: 0.000005
  lr_patience: 5
  lr_decay_factor: 0.5
  min_lr: 0.000005
  grad_clip: 5.0
  sample_weighting:
    enabled: true
    slot_inverse_frequency_power: 0.35
    mask_pattern_inverse_frequency_power: 0.10
    primary_inverse_frequency_power: 0.05
    min_weight: 0.60
    max_weight: 2.50
    normalize_train_mean: true

baselines:
  enabled: false

evaluation:
  num_generated_samples: 256
  sample_event_structure_split: train
  event_structure_sampling: multinomial
  sampling_temperature: 1.0
  sampling_max_rounds: 20
  sampling_oversample_factor: 3
  reject_invalid_samples: true
  generate_figures: false
