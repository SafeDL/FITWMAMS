# Canonical highD preprocessing, shared-sequence, and EVT configuration.

paths:
  raw_dir: "../highD_dataset/Matlab/data"
  output_dir: "../results/evt"
  sequence_cache_dir: "../results/highd_shared_training_data/highd_sequence_cache"
  flow_schema: "../results/highd_shared_training_data/scenario_conditions/dataset_schema.json"
  # The sequence builder consumes the same canonical configuration.
  highd_preprocessing_config: "config.yaml"

recordings:
  include: "all"
  exclude: []

sampling:
  # The current fixed-window contract uses native highD frame numbers.
  target_fps: 25

filters:
  max_abs_accel: 8.0
  max_abs_jerk: 30.0
  max_position_jump: 5.0
  min_vehicle_speed: 0.0

segments:
  # Natural driving screening uses one complete fixed-length window. There is
  # no history/future split for EVT calibration.
  window_seconds: 6.0
  # Adjacent anchors for the same ego have non-overlapping 6 s risk windows.
  anchor_stride_seconds: 6.0
  min_ego_speed_mps: 5.0
  max_slot_longitudinal_distance_m: 150.0
  lateral_pre_cross_seconds: 1.0
  lateral_post_cross_seconds: 2.0
  lateral_stable_steps: 5

risk:
  # Main EVT score: Safety-Envelope Intrusion Risk, R_SEI.
  safety_envelope:
    prediction_horizon_seconds: 1.5
    prediction_dt_seconds: 0.2
    prediction_use_acceleration: false
    acceleration_clip_mps2: 3.0
    longitudinal_mode: calibrated_headway
    longitudinal_time_gap_seconds: 0.7
    longitudinal_min_margin_m: 1.0
    longitudinal_brake_mps2: 4.0
    rss_response_time_seconds: 0.75
    rss_accel_max_mps2: 2.0
    rss_brake_min_mps2: 4.0
    rss_brake_max_mps2: 8.0
    lateral_min_margin_m: 0.2
    lateral_response_time_seconds: 1.0
    lateral_brake_mps2: 0.8
    pair_smooth_beta: 8.0
    horizon_smooth_beta: 8.0
    horizon_time_discount: 0.1
    exposure_weight: 0.15

dataset:
  sequence_protocol: fixed_horizon_5p96
  max_sequences: 0

split:
  seed: 42

evt:
  return_periods: [20, 50, 100, 500, 1000]
  min_exceedances: 200
  max_tail_fraction: 0.20
  # Tied risks share one threshold, so the final unique count can be smaller.
  max_threshold_candidates: 400
  min_threshold_exceedance_rate: 0.01
  bootstrap_samples: 200
  random_seed: 42

event_grouping:
  min_shared_actors: 2
  min_actor_overlap: 0.5
  max_group_span_windows: 2.0

event_bank:
  seed: 20260926

manifests:
  validation_size_per_cohort: 90
  test_size_per_cohort: 90
  train_size_per_cohort: 500
  seed: 20260926
