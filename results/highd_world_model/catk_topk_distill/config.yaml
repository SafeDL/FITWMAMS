# highD 长尾背景交通世界模型：唯一活动实现。

seed: 42

paths:
  highd_evt_config: "../../../process_highD/scripts/configs/highd_natural_evt.yaml"
  raw_dir: "../../../highD_dataset/Matlab/data"
  natural_segments_csv: "../../../results/highd_natural_evt/natural_segments.csv"
  tail_context_csv: "../../../results/highd_natural_evt/natural_tail_contexts.csv"
  dataset_dir: "../../../results/highd_world_model/shared_dense_start_roll"
  output_dir: "../../../results/highd_world_model/catk_topk_distill"

sampling:
  target_fps: 25

dataset:
  history_seconds: 1.0
  horizon_seconds: 1.0
  segment_window_seconds: 6.0
  roll_start_seconds: 1.0
  roll_end_seconds: 4.8
  roll_stride_seconds: 0.20
  max_segments: 0

split:
  group_by: "recording_ego"
  ratios: [0.70, 0.15, 0.15]
  seed: 42

model:
  type: "catk_topk"
  architecture_version: 2
  hidden_dim: 128
  history_layers: 2
  interaction_layers: 2
  num_heads: 4
  dropout: 0.10
  use_start_flow_summary: true
  use_relation_features: true
  num_candidates: 8
  responsibility_temperature: 1.0
  energy_weight: 0.01
  diversity_weight: 0.15
  diversity_margin_normalized: 0.15
  probability_entropy_weight: 0.05
  min_probability_entropy: 1.50
  smoothness_weight: 0.01
  jerk_control_points: 5
  max_jerk_longitudinal_mps3: 8.0
  max_jerk_lateral_mps3: 5.0
  branch_noise_std: 0.0

# Xi_world 只表示 CAT-K 候选索引；环境接口不添加额外连续动作噪声。
environment:
  candidate_selection: "categorical"
  candidate_temperature: 1.0
  world_seed: 123

training:
  seed: 42
  device: "auto"
  epochs: 80
  batch_size: 512
  num_workers: 0
  learning_rate: 0.00002
  min_learning_rate: 0.000002
  weight_decay: 0.0001
  grad_clip: 1.0
  resume_from_checkpoint: false
  initialize_from_checkpoint: "../catk_topk/checkpoints/best_world_model.pt"
  teacher_checkpoint: "../catk_topk_baseline/checkpoints/best_world_model.pt"
  performance:
    allow_tf32: true
    float32_matmul_precision: "high"
    mixed_precision: "bf16"
    fused_adamw: true
    compile_model: false
    compile_mode: "default"
  no_improvement_patience: 0
  no_improvement_min_delta: 0.0001
  diagnostic_validation_interval: 5
  closed_loop_adaptation:
    enabled: false
    probability: 0.35
    history_dropout_probability: 0.05
    state_noise_std:
      x_m: 0.20
      y_left_m: 0.05
      vx_mps: 0.20
      vy_left_mps: 0.05
      ax_mps2: 0.15
      ay_left_mps2: 0.05
  loss_weights:
    trajectory: 0.0
    interaction: 0.0
    physics: 0.0
  model_state_closed_loop:
    enabled: true
    max_chunks: 5
    curriculum_epochs_per_chunk: 1
    state_consistency_weight: 0.10
    teacher_action_weight: 0.10

evaluation:
  seed: 123
  device: "auto"
  batch_size: 1024
  performance:
    allow_tf32: false
    float32_matmul_precision: "highest"
  sampling_temperature: 1.0
  sampling_action_std_floor_mps2: null
  splits: ["val", "test"]
  closed_loop:
    enabled: true
    max_samples: 0
  model_state_reconstruction:
    enabled: true
    max_chunks: 5
    max_samples: 0
  tail_event_reconstruction:
    enabled: true
    max_samples: 0
    write_event_metrics: false
  visualizations:
    enabled: false
