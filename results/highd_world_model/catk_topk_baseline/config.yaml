paths:
  highd_evt_config: ../../../process_highD/scripts/configs/highd_natural_evt.yaml
  raw_dir: ../../../highD_dataset/Matlab/data
  natural_segments_csv: ../../../results/highd_natural_evt/natural_segments.csv
  tail_context_csv: ../../../results/highd_natural_evt/natural_tail_contexts.csv
  dataset_dir: ../../../results/highd_world_model/shared_dense_start_roll
  output_dir: ../../../results/highd_world_model/catk_topk_baseline
sampling:
  target_fps: 25
dataset:
  history_seconds: 1.0
  horizon_seconds: 1.0
  segment_window_seconds: 6.0
  roll_start_seconds: 1.0
  roll_end_seconds: 4.8
  roll_stride_seconds: 0.2
  max_segments: 0
split:
  group_by: recording_ego
  ratios:
  - 0.7
  - 0.15
  - 0.15
  seed: 42
model:
  type: catk_topk
  hidden_dim: 128
  history_layers: 2
  interaction_layers: 2
  num_heads: 4
  dropout: 0.1
  use_start_flow_summary: true
  min_log_std: -2.5
  max_log_std: 2.0
  use_relation_features: true
  num_candidates: 8
  candidate_ce_weight: 0.05
  branch_noise_std: 0.02
environment:
  candidate_selection: categorical
  candidate_temperature: 1.0
  world_seed: 123
training:
  seed: 42
  device: auto
  epochs: 80
  batch_size: 1024
  num_workers: 0
  learning_rate: 0.0002
  min_learning_rate: 1.0e-05
  weight_decay: 0.0001
  grad_clip: 1.0
  resume_from_checkpoint: false
  performance:
    allow_tf32: true
    float32_matmul_precision: high
    mixed_precision: bf16
    fused_adamw: true
    compile_model: false
    compile_mode: default
  no_improvement_patience: 12
  no_improvement_min_delta: 0.0001
  diagnostic_validation_interval: 5
  closed_loop_adaptation:
    enabled: true
    probability: 0.35
    history_dropout_probability: 0.05
    state_noise_std:
      x_m: 0.2
      y_left_m: 0.05
      vx_mps: 0.2
      vy_left_mps: 0.05
      ax_mps2: 0.15
      ay_left_mps2: 0.05
  loss_weights:
    trajectory: 0.0
    interaction: 0.0
    physics: 0.0
evaluation:
  seed: 123
  device: auto
  batch_size: 1024
  performance:
    allow_tf32: false
    float32_matmul_precision: highest
  sampling_temperature: 1.0
  sampling_action_std_floor_mps2: null
  splits:
  - val
  - test
  closed_loop:
    enabled: true
    max_samples: 0
  tail_event_reconstruction:
    enabled: true
    max_samples: 0
    write_event_metrics: false
  visualizations:
    enabled: false
