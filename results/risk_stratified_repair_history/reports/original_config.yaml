# Single-seed protocol. Search caps allow early completion; initial policies are imported.
output_dir: results/method_c/branching
master_seed: 20260926
seeds:
- 20260926
algorithms:
- dqn
- ppo
- carl
- plant2
- diffusion_planner
- dtpp
- flow_planner
- str2
methods:
- monte_carlo
- subset
- guided
rounds: 2
runtime:
  device: cuda
  world_device: cpu
  torch_threads: 1
  generation_batch_size: 32
world_config: hierarchical_world_model/config.yaml
evt_model: results/evt/evt_model.json
ddim_steps: 20
baseline: {}
repair:
  normal_instances: 512
  rl_steps: 20480
  plant_updates: 1000
  plant_normal_teacher_instances: 32
  plant_new_teacher_instances: 32
  plant_batch_size: 64
  micro_batch_sizes: {str2: 1}
  plant_micro_batch_size: 8
  plant_learning_rate: 1.0e-05
teacher:
  candidate_budget: 128
search:
  budget: 5000
  batch_size: 250
  generation_batch_size: 32
  initial_samples: 500
  fresh_samples: 500
  branch_check_budget: 500
  graph_size: 12
  replay_limit: 256
  elite_fraction: 0.1
  beta: 0.2
  joint_fraction: 0.2
  subset_max_levels: 8
  terminal_proposals: 250
  archive_capacity: 16
  archive_root_limit: 4
evaluation:
  instances: 2000
  bootstrap_replicates: 10000
  natural_flow_checkpoint: results/natural_flow/checkpoints/scenario_flow.pt
  natural_dataset: results/highd_shared_training_data/scenario_conditions/dataset.npz
  natural_segments: results/evt/natural_segments.csv
  sequence_cache: results/highd_shared_training_data/highd_sequence_cache/sequence_cache
dqn:
  learning_rate: 0.0001
  batch_size: 128
  buffer_size: 100000
  learning_starts: 1024
  gamma: 0.99
  exploration_fraction: 0.3
  exploration_final_eps: 0.05
ppo:
  learning_rate: 0.0001
  n_steps: 2048
  batch_size: 128
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
carl:
  rollout_steps: 4096
  batch_size: 1024
  micro_batch_size: 128
  epochs: 4
  learning_rate: 2.5e-05
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.1
  value_coefficient: 0.5
  entropy_coefficient: 0.01
run_kind: formal
manual_nuplan:
  output_dir: results/method_c/manual_nuplan
  automatic_evaluation: false
