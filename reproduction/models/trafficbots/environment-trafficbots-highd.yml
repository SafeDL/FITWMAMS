name: trafficbots-highd
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pytorch=1.13.1
  - pytorch-cuda=11.7
  # PyTorch 1.13 wheels are compiled against NumPy 1.x.
  - numpy<2
  - scipy
  - pandas
  - pyyaml
  # Needed when this environment also runs the shared Flow initial-scene prior.
  - matplotlib-base
  - pillow
  - imageio
  - gymnasium
  - pygame
  # Lightning 1.9 still imports pkg_resources, removed by setuptools 81.
  - setuptools<81
  - pip
  - pip:
      - omegaconf==2.3.0
      - hydra-core==1.3.2
      - pytorch-lightning==1.9.5
      - torchmetrics==0.11.4
      - transforms3d==0.4.2
      - UMNN==1.71
