# IDM rare-event estimation under the maintained Flow -> Diffusion -> HiQR world.

paths:
  # This referenced config supplies all three required checkpoints:
  # EVT-tail Flow -> 149-frame Diffusion -> HiQR. It is not a Flow-only run.
  world_model_config: ../../hierarchical_world_model/config.yaml
  evt_model: ../../results/evt/evt_model.json
  idm_ego_config: ../../tools/idm_ego.yaml

simulation:
  steps: 149
  ddim_steps: 20
  execution_backend: local_highway_env

# Standard generated-world chain:
# EVT tail -> Flow samples M/C0/K/D -> size-conditioned Diffusion samples 149 frames
# -> HiQR and online response run the closed loop.
test_space:
  kind: full_prior

evaluation_scope:
  schema: highd_all_background
  excluded_background_slots: []

runtime:
  device: auto
  batch_size: 32

failure_event:
  # The human-calibrated 100-event return level is the fixed final threshold.
  return_period: 100

subset_simulation:
  num_samples: 512
  # Each level keeps the highest-risk 10% of the current population.
  p0: 0.1
  max_levels: 8
  mutation_blocks:
    - scenario
    - c0_base_latent  # 26-D initial position/velocity state
    - k_base_latent
    - diffusion_noise  # changing it rebuilds the 149-frame Diffusion plan
    - driver_latent
    - maneuver_latent
    - scene_innovations
    - agent_response_innovations
    - policy_response_innovations
    - policy_calibration_innovations
  pcn_beta: 0.20
  mcmc_steps: 3
  seed: 20260823
  output_dir: ../../results/idm_ams/hierarchical_world_model/evt_tail_with_dimensions/subset

monte_carlo:
  num_samples: 2000
  sample_batch_size: 32
  seed: 20260824
  output_dir: ../../results/idm_ams/hierarchical_world_model/evt_tail_with_dimensions/monte_carlo

output:
  top_cases: 10
